<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8th Grade Bio Notes</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #f5f7ff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(91, 108, 255, .12), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(155, 89, 255, .10), transparent 30%),
        #03040a;
      overflow-x: hidden;
    }

    /* Star field */
    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.65) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.5) 0 .8px, transparent 1.3px);
      background-size: 120px 120px, 190px 190px, 270px 270px;
      background-position: 10px 30px, 70px 100px, 30px 160px;
      opacity: .55;
    }
    body::after {
      opacity: .28;
      transform: scale(1.2);
    }

    .wrap { width: min(1050px, calc(100% - 40px)); margin: auto; }

    header {
      padding: 76px 0 52px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      backdrop-filter: blur(12px);
      color: #cbd3ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(42px, 7vw, 76px);
      line-height: .98;
      letter-spacing: -.055em;
      background: linear-gradient(120deg, #ffffff 25%, #b9c2ff 55%, #8e9cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 650px;
      margin: auto;
      color: #a9afc2;
      font-size: 18px;
      line-height: 1.65;
    }

    main { padding-bottom: 80px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 18px 0 20px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -.025em;
    }

    .count {
      color: #8f96aa;
      font-size: 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 28px;
      background: linear-gradient(145deg, rgba(18,21,35,.88), rgba(8,10,18,.82));
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(16px);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(160,170,255,.35);
      box-shadow: 0 30px 80px rgba(0,0,0,.48);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      top: -120px;
      right: -80px;
      border-radius: 50%;
      background: rgba(112,126,255,.13);
      filter: blur(4px);
    }

    .icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 27px;
      margin-bottom: 22px;
    }

    .card h3 { margin: 0 0 8px; font-size: 26px; }
    .card p { margin: 0 0 23px; color: #9ea5b9; line-height: 1.6; }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 18px;
      border-radius: 12px;
      color: #fff;
      background: #5868e8;
      text-decoration: none;
      font-weight: 750;
      border: 1px solid rgba(255,255,255,.12);
      transition: background .2s ease, transform .2s ease;
    }
    .open-btn:hover { background: #6a79f4; transform: translateY(-1px); }

    footer {
      padding: 25px 0 45px;
      color: #666d82;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .wrap { width: min(100% - 24px, 1050px); }
      header { padding: 55px 0 38px; }
      .card { padding: 22px; }
      .subtitle { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="badge">✦ Free study resource</div>
    <h1>8th Grade Bio Notes</h1>
    <p class="subtitle">
      A simple place to find biology notes and study materials designed for 8th grade students.
    </p>
  </header>

  <main class="wrap">
    <div class="section-title">
      <h2>Biology Notes</h2>
      <span class="count">1 PDF available</span>
    </div>

    <article class="card">
      <div class="icon">🧬</div>
      <h3>Bio Notes #1</h3>
      <p>8th Grade Biology — Notes PDF</p>
      <a
        class="open-btn"
        href="https://drive.google.com/file/d/17fnGh6r4At49FMp82mFwWKkhkLGUKqNz/view?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open PDF <span>↗</span>
      </a>
    </article>
  </main>

  <footer class="wrap">
    8th Grade Bio Notes · Free student study resource
  </footer>
</body>
</html>
